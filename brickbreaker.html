
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYZONE - Brick Breaker</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px 12px;
 background:#090910;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
h1{color:#b56cff}
.game{
 max-width:440px;margin:auto;padding:15px;
 background:#171323;border:1px solid #7135a8;
 border-radius:18px;
}
.score{display:flex;justify-content:space-around;color:#d8b5ff;font-weight:bold;margin:12px}
canvas{
 width:100%;max-width:380px;
 background:#080d13;border:2px solid #a34cff;
 border-radius:10px;display:block;margin:15px auto;
 touch-action:none;
}
button{
 background:#8b35d6;color:white;border:0;
 padding:12px 18px;border-radius:9px;
 font-size:16px;font-weight:bold;margin:5px;
}
#message{color:#ffd36a;min-height:24px}
.controls{display:flex;justify-content:center;gap:25px}
.back{background:#333}
</style>
</head>
<body>
<h1>🧱 PLAYZONE</h1>
<p>BRICK BREAKER</p>

<div class="game">
 <div class="score">
  <span>Score: <span id="score">0</span></span>
  <span>Lives: <span id="lives">3</span></span>
 </div>

 <canvas id="board" width="380" height="440"></canvas>
 <div id="message">Press START to Play!</div>
 <button onclick="startGame()">START GAME</button>
 <button onclick="pauseGame()">PAUSE</button>

 <div class="controls">
  <button id="left">⬅️ LEFT</button>
  <button id="right">RIGHT ➡️</button>
 </div>
 <p>Move the paddle and break all bricks!</p>
 <button class="back" onclick="location.href='index.html'">🏠 HOME</button>
</div>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const W=380,H=440;

let paddle={x:145,y:410,w:90,h:12};
let ball={x:190,y:390,r:8,dx:3,dy:-3};
let bricks=[];
let score=0,lives=3;
let running=false,over=false;
let animation=null;
let left=false,right=false;
let powerUps=[];
let extraBall=false;
let shield=false;
 
function createBricks(){
 bricks=[];
 for(let r=0;r<5;r++){
  for(let c=0;c<7;c++){
   bricks.push({
    x:12+c*51,y:45+r*25,
    w:44,h:17,alive:true,
    color:["#b34dff","#8b35d6","#e04cff","#673ab7","#a855f7"][r]
   });
  }
 }
}

function reset(){
 score=0;lives=3;over=false;
 paddle.x=145;
 ball={x:190,y:390,r:8,dx:3,dy:-3};
 createBricks();
 updateScore();
 draw();
}

function updateScore(){
 document.getElementById("score").textContent=score;
 document.getElementById("lives").textContent=lives;
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#080d13";
 ctx.fillRect(0,0,W,H);

 bricks.forEach(b=>{
  if(!b.alive)return;
  ctx.fillStyle=b.color;
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.strokeStyle="#ffffff55";
  ctx.strokeRect(b.x,b.y,b.w,b.h);
 });
powerUps.forEach(p=>{
  ctx.font="22px Arial";
  ctx.fillText(p.type,p.x,p.y);
});
 ctx.fillStyle="#c084fc";
 ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);

 ctx.beginPath();
 ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
 ctx.fillStyle="#ffffff";
 ctx.fill();
}

function startGame(){
 if(over)reset();
 if(running)return;
 running=true;
 document.getElementById("message").textContent="Game Running!";
 loop();
}

function pauseGame(){
 if(!running)return;
 running=false;
 cancelAnimationFrame(animation);
 document.getElementById("message").textContent="Game Paused";
}

function endGame(won){
 running=false;over=true;
 cancelAnimationFrame(animation);
 document.getElementById("message").textContent=
 won?"🏆 YOU WIN! Score: "+score:"GAME OVER! Score: "+score;
}

function loop(){
 if(!running)return;

 if(left)paddle.x-=6;
 if(right)paddle.x+=6;
 paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));

 ball.x+=ball.dx;
 ball.y+=ball.dy;

 if(ball.x<ball.r||ball.x>W-ball.r)ball.dx*=-1;
 if(ball.y<ball.r)ball.dy*=-1;

 if(ball.y+ball.r>=paddle.y &&
 ball.x>=paddle.x && ball.x<=paddle.x+paddle.w &&
 ball.dy>0){
  ball.dy=-Math.abs(ball.dy);
  ball.dx=(ball.x-(paddle.x+paddle.w/2))/12;
 }

 for(let b of bricks){
  if(b.alive &&
   ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w &&
   ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
    b.alive=false;
    ball.dy*=-1;
    score+=10;
    updateScore();
    break;
  }
 }

 if(bricks.every(b=>!b.alive)){
  draw();endGame(true);return;
 }

 if(ball.y>H){
  lives--;updateScore();
  if(lives<=0){draw();endGame(false);return;}
  ball={x:190,y:390,r:8,dx:3,dy:-3};
  paddle.x=145;
 }

 draw();
 animation=requestAnimationFrame(loop);
}

function hold(btn,direction){
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(direction==="left")left=true;
  else right=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
  btn.addEventListener(ev,()=>{
   if(direction==="left")left=false;
   else right=false;
  });
 });
}
hold(document.getElementById("left"),"left");
hold(document.getElementById("right"),"right");

canvas.addEventListener("pointermove",e=>{
 const rect=canvas.getBoundingClientRect();
 const x=(e.clientX-rect.left)*W/rect.width;
 paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));
});

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")left=true;
 if(e.key==="ArrowRight")right=true;
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")left=false;
 if(e.key==="ArrowRight")right=false;
});

reset();
</script>
</body>
</html>
